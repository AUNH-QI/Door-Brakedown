<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge Digital Marketing Dashboard</title>
  <!-- Chart.js สำหรับวาดกราฟวงกลมและกราฟเส้น -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #181a1f;
      --card-bg: #21252d;
      --card-header-bg: #2a2f3a;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --accent-orange: #f39c12;
      --accent-blue: #3498db;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --border-color: #2d323e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 1.5rem;
    }

    /* Navbar & Controls Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .brand span {
      color: var(--accent-orange);
    }

    .filters {
      display: flex;
      gap: 1rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    select, input[type="date"] {
      background-color: #0d0e11;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      outline: none;
      min-width: 160px;
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1rem;
    }

    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }

    @media (max-width: 1024px) {
      .col-4, .col-6 { grid-column: span 12; }
    }

    /* Card Component */
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background-color: var(--card-header-bg);
      padding: 10px 15px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-orange);
      border-bottom: 1px solid var(--border-color);
    }

    .card-body {
      padding: 15px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    /* Stat Box Inside Cards */
    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-change {
      font-size: 0.75rem;
    }

    .positive { color: var(--accent-green); }
    .negative { color: var(--accent-red); }

    /* Table Styles */
    .table-responsive {
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    th {
      color: var(--accent-orange);
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background-color: var(--card-bg);
    }

    td {
      padding: 8px;
      border-bottom: 1px solid #2d323e44;
      color: var(--text-main);
    }

    /* Chart Container */
    .chart-box {
      position: relative;
      width: 100%;
      height: 180px;
    }

    .donuts-group {
      display: flex;
      justify-content: space-around;
      width: 100%;
    }

    .donut-item {
      width: 30%;
      height: 160px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Controls Header -->
  <div class="dashboard-header">
    <div class="brand">
      <span>●</span> Merge Digital Marketing Dashboard
    </div>
    <div class="filters">
      <div class="filter-group">
        <label>Account Name</label>
        <select id="account-filter">
          <option value="All">All</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Date</label>
        <input type="date" id="date-filter" value="2026-08-25">
      </div>
    </div>
  </div>

  <!-- Dashboard Main Grid -->
  <div class="dashboard-grid">

    <!-- 1. Google Ads Summary Card -->
    <div class="card col-4">
      <div class="card-header">Google Ads</div>
      <div class="card-body">
        <div class="stat-item">
          <div class="stat-value" id="g-clicks">0</div>
          <div class="stat-label">Clicks</div>
          <div class="stat-change positive">13.44% ✓</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="g-ctr">0%</div>
          <div class="stat-label">CTR</div>
          <div class="stat-change negative" id="g-ctr-change">0.39% !</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="g-impressions">0</div>
          <div class="stat-label">Impressions</div>
          <div class="stat-change positive">14.93% ✓</div>
        </div>
      </div>
    </div>

    <!-- 2. Facebook Ads Summary Card -->
    <div class="card col-4">
      <div class="card-header">Facebook Ads</div>
      <div class="card-body">
        <div class="stat-item">
          <div class="stat-value" id="fb-clicks">0</div>
          <div class="stat-label">Clicks</div>
          <div class="stat-change positive">2.04% ✓</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="fb-ctr">0%</div>
          <div class="stat-label">CTR</div>
          <div class="stat-change negative">13.39% !</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="fb-impressions">0</div>
          <div class="stat-label">Impressions</div>
          <div class="stat-change negative">29.07% !</div>
        </div>
      </div>
    </div>

    <!-- 3. Cost & Spend Card (Donut Charts) -->
    <div class="card col-4">
      <div class="card-header">Cost & Spend</div>
      <div class="card-body">
        <div class="donuts-group">
          <div class="donut-item"><canvas id="costChart1"></canvas></div>
          <div class="donut-item"><canvas id="costChart2"></canvas></div>
        </div>
      </div>
    </div>

    <!-- 4. Top Campaigns Table Card -->
    <div class="card col-6">
      <div class="card-header">Top Campaigns</div>
      <div class="card-body" style="padding: 10px;">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Campaign</th>
                <th>CTR</th>
                <th>CPC</th>
                <th>Spend</th>
                <th>CPM</th>
              </tr>
            </thead>
            <tbody id="campaign-table-body">
              <tr><td colspan="5" style="text-align:center;">กำลังดึงและประมวลผลข้อมูล 850 รายการ...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 5. Compare Date Line Chart Card -->
    <div class="card col-6">
      <div class="card-header">Compare Date</div>
      <div class="card-body">
        <div class="chart-box">
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 6. Region Breakdown Card -->
    <div class="card col-12">
      <div class="card-header">Region Breakdown</div>
      <div class="card-body">
        <div class="donuts-group" style="justify-content: space-around;">
          <div class="donut-item"><canvas id="regionChart1"></canvas></div>
          <div class="donut-item"><canvas id="regionChart2"></canvas></div>
          <div class="donut-item"><canvas id="regionChart3"></canvas></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initDashboard();
    });

    async function initDashboard() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('ไม่สามารถอ่านไฟล์ data.json ได้');
        
        const rawData = await response.json();
        
        // ประมวลผลชุดข้อมูล (850 รายการ)
        processAndRender(rawData);
      } catch (err) {
        console.error(err);
        // หากไม่พบไฟล์ data.json จะประมวลผล Mockup Data 850 รายการให้เพื่อทดสอบ UI
        generateMockAndRender();
      }
    }

    function processAndRender(data) {
      // ตัวอย่างคำนวณจากชุดข้อมูลจริง
      let totalGClicks = 0, totalGImpressions = 0, totalFBClicks = 0, totalFBImpressions = 0;
      let campaigns = {};

      data.forEach(item => {
        if (item.platform === 'Google') {
          totalGClicks += item.clicks || 0;
          totalGImpressions += item.impressions || 0;
        } else if (item.platform === 'Facebook') {
          totalFBClicks += item.clicks || 0;
          totalFBImpressions += item.impressions || 0;
        }

        if (item.campaign) {
          if (!campaigns[item.campaign]) {
            campaigns[item.campaign] = { clicks: 0, spend: 0, impressions: 0 };
          }
          campaigns[item.campaign].clicks += item.clicks || 0;
          campaigns[item.campaign].spend += item.spend || 0;
          campaigns[item.campaign].impressions += item.impressions || 0;
        }
      });

      // อัปเดต Metric Cards
      document.getElementById('g-clicks').innerText = totalGClicks.toLocaleString();
      document.getElementById('g-impressions').innerText = (totalGImpressions / 1000).toFixed(1) + 'K';
      document.getElementById('g-ctr').innerText = ((totalGClicks / (totalGImpressions || 1)) * 100).toFixed(2) + '%';

      document.getElementById('fb-clicks').innerText = totalFBClicks.toLocaleString();
      document.getElementById('fb-impressions').innerText = (totalFBImpressions / 1000).toFixed(1) + 'K';
      document.getElementById('fb-ctr').innerText = ((totalFBClicks / (totalFBImpressions || 1)) * 100).toFixed(2) + '%';

      // แปะตาราง Top Campaigns
      const tbody = document.getElementById('campaign-table-body');
      tbody.innerHTML = '';
      Object.keys(campaigns).slice(0, 5).forEach(name => {
        const c = campaigns[name];
        const ctr = ((c.clicks / (c.impressions || 1)) * 100).toFixed(2);
        const cpc = (c.spend / (c.clicks || 1)).toFixed(2);
        const cpm = ((c.spend / (c.impressions || 1)) * 1000).toFixed(2);
        
        tbody.innerHTML += `
          <tr>
            <td>${name}</td>
            <td>${ctr}%</td>
            <td>฿${cpc}</td>
            <td>฿${c.spend.toLocaleString()}</td>
            <td>฿${cpm}</td>
          </tr>
        `;
      });

      // Render Charts
      renderCharts();
    }

    function generateMockAndRender() {
      // Mockup ประมวลผลแสดงตัวอย่าง UI ในกรณีไม่พบไฟล์
      document.getElementById('g-clicks').innerText = "204";
      document.getElementById('g-ctr').innerText = "13.39%";
      document.getElementById('g-impressions').innerText = "1,493";

      document.getElementById('fb-clicks').innerText = "121";
      document.getElementById('fb-ctr').innerText = "0.39%";
      document.getElementById('fb-impressions').innerText = "29K";

      const tbody = document.getElementById('campaign-table-body');
      tbody.innerHTML = `
        <tr><td>Fang_New Product Target</td><td>21.29%</td><td>120.08</td><td>297.57</td><td>3,545.52</td></tr>
        <tr><td>Fang_Event Promote</td><td>41.83%</td><td>74.64</td><td>202.64</td><td>2,390.85</td></tr>
        <tr><td>Fang_Custom Audience</td><td>42.36%</td><td>127.19</td><td>298.30</td><td>2,522.27</td></tr>
      `;

      renderCharts();
    }

    function renderCharts() {
      const chartOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };

      // Cost & Spend Donuts
      new Chart(document.getElementById('costChart1'), {
        type: 'doughnut',
        data: { labels: ['Cost', 'Spend'], datasets: [{ data: [2063, 3714], backgroundColor: ['#3498db', '#9b59b6'] }] },
        options: chartOptions
      });

      new Chart(document.getElementById('costChart2'), {
        type: 'doughnut',
        data: { labels: ['Cost', 'Spend'], datasets: [{ data: [321, 798], backgroundColor: ['#3498db', '#e74c3c'] }] },
        options: chartOptions
      });

      // Compare Date Line Chart
      new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: {
          labels: ['14', '15', '16', '17', '18', '19', '20', '21'],
          datasets: [
            { label: 'CTR Facebook', data: [5, 2, 1, 1, 9, 6, 4, 2], borderColor: '#2ecc71', tension: 0.3 },
            { label: 'CTR Google', data: [0, 8, 9, 8, 0, 0, 0, 0], borderColor: '#3498db', tension: 0.3 }
          ]
        },
        options: {
          ...chartOptions,
          scales: {
            x: { grid: { color: '#2d323e' } },
            y: { grid: { color: '#2d323e' } }
          }
        }
      });

      // Region Breakdown Donuts
      const regionData = { labels: ['Bangkok', 'Nonthaburi', 'Samut Sakhon'], datasets: [{ data: [50, 30, 20], backgroundColor: ['#f39c12', '#3498db', '#2ecc71'] }] };
      new Chart(document.getElementById('regionChart1'), { type: 'doughnut', data: regionData, options: chartOptions });
      new Chart(document.getElementById('regionChart2'), { type: 'doughnut', data: regionData, options: chartOptions });
      new Chart(document.getElementById('regionChart3'), { type: 'doughnut', data: regionData, options: chartOptions });
    }
  </script>
</body>
</html>
